<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1068" width="1000" height="1068" role="img" aria-labelledby="title desc"><title id="title">Singapore multi-code BIM review architecture</title><desc id="desc">BCA and SCDF provisions feed a versioned source register and a clause store. GraphRAG finds candidates. A separate register preserves explicit citations and reviewer-curated links. Both feed an evidence review alongside project facts, producing a clause-cited finding.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#657E83" /></marker></defs><rect x="0" y="0" width="1000" height="1068" rx="0" fill="#F5F9F8" /><text x="44" y="67" font-family="Liberation Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#163642">Multi-code BIM review</text><text x="45" y="105" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#475F66">How ICM and GraphRAG connect Singapore codes to project evidence</text><rect x="44" y="143" width="210" height="85" rx="12" fill="#FFFFFF" stroke="#B7C9C9" stroke-width="1.7" /><text x="58" y="167" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F6059">BCA</text><text x="58" y="193" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">Accessibility</text><text x="58" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">Code 2025 v1.1</text><rect x="278" y="143" width="210" height="85" rx="12" fill="#FFFFFF" stroke="#B7C9C9" stroke-width="1.7" /><text x="292" y="167" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F6059">SCDF</text><text x="292" y="193" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">Fire Code</text><text x="292" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">2023</text><rect x="512" y="143" width="210" height="85" rx="12" fill="#FFFFFF" stroke="#B7C9C9" stroke-width="1.7" /><text x="526" y="167" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F6059">BCA</text><text x="526" y="193" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">Approved</text><text x="526" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">Document</text><rect x="746" y="143" width="210" height="85" rx="12" fill="#FFFFFF" stroke="#B7C9C9" stroke-width="1.7" stroke-dasharray="5 4" /><text x="760" y="167" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F6059">NEXT SOURCE</text><text x="760" y="193" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">Building Control</text><text x="760" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#163642">Regulations</text><path d="M149 228 V251" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M383 228 V251" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M617 228 V251" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M851 228 V251 H617" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-dasharray="5 4" /><path d="M149 251 H617" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M500 251 V273" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#tip)" /><rect x="44" y="274" width="912" height="85" rx="12" fill="#FFFFFF" stroke="#B7C9C9" stroke-width="1.7" /><rect x="62" y="293" width="53" height="47" rx="8" fill="#E1EFEB" /><text x="74" y="325" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F6059">01</text><text x="137" y="310" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#163642">Register sources</text><text x="138" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#475F66">Record the authority, edition, effective dates and official source.</text><path d="M500 359 V389" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#tip)" /><rect x="44" y="390" width="912" height="85" rx="12" fill="#FFFFFF" stroke="#B7C9C9" stroke-width="1.7" /><rect x="62" y="409" width="53" height="47" rx="8" fill="#E1EFEB" /><text x="74" y="441" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F6059">02</text><text x="137" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#163642">Build clause records</text><text x="138" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#475F66">Keep the parent condition, clause ID, page or web locator, and figure links.</text><path d="M500 475 V501" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M260 501 H740" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M260 501 V528" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#tip)" /><path d="M740 501 V528" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#tip)" /><rect x="44" y="529" width="432" height="140" rx="12" fill="#E6F2EF" stroke="#ACCBC4" stroke-width="1.7" /><text x="66" y="559" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F6059">03  /  DISCOVERY</text><text x="66" y="593" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#163642">GraphRAG search</text><text x="66" y="625" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#475F66">Retrieve likely clauses through</text><text x="66" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#475F66">related terms and source passages.</text><rect x="524" y="529" width="432" height="140" rx="12" fill="#E6F2EF" stroke="#ACCBC4" stroke-width="1.7" /><text x="546" y="559" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F6059">03  /  VERIFIED LINKS</text><text x="546" y="593" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#163642">Relationship register</text><text x="546" y="625" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#475F66">Follow explicit citations and reviewed</text><text x="546" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#475F66">mappings to spaces or systems.</text><path d="M260 669 V703" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M740 669 V703" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M260 703 H740" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M334 703 V747" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#tip)" /><rect x="44" y="748" width="578" height="128" rx="12" fill="#FFFFFF" stroke="#B7C9C9" stroke-width="1.7" /><text x="65" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F6059">04  /  ICM REVIEW</text><text x="65" y="817" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#163642">Check applicability and evidence</text><text x="65" y="849" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#475F66">Open the clauses and compare the project records.</text><rect x="682" y="748" width="274" height="128" rx="12" fill="#FBF0DD" stroke="#D5BE97" stroke-width="1.7" /><text x="701" y="779" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#754106">MANUAL PROJECT INPUT</text><text x="701" y="813" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#163642">Project evidence</text><text x="701" y="841" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#475F66">Use, date, room ID,</text><text x="701" y="864" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#475F66">drawings and schedules</text><path d="M682 814 H624" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#tip)" /><path d="M334 876 V911" stroke="#657E83" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" fill="none" marker-end="url(#tip)" /><rect x="44" y="912" width="912" height="98" rx="12" fill="#163642" /><text x="66" y="951" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Clause-cited finding</text><text x="67" y="983" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#D9EBE6">Each applicable duty, the supporting project evidence and any open item.</text><text x="45" y="1047" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#475F66">The local pilot tests retrieval and clause links. Project evidence enters during review.</text></svg>